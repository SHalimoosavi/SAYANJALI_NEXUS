name: Generate static company pages
on:
  push:
    branches:
      - build/company-site-v2
permissions:
  contents: write
concurrency:
  group: company-site-generation
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: build/company-site-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate static pages
        run: node scripts/build.mjs
      - name: Validate generated pages
        run: node scripts/validate.mjs
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: generate static company pages"
            git push origin build/company-site-v2
          fi

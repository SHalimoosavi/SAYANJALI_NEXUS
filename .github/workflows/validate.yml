name: Validate company website
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pages
        run: node scripts/build.mjs
      - name: Validate metadata, links, schema and budgets
        run: node scripts/validate.mjs --external
